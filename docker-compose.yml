name: slops
services:
  slops:
    build:
      context: .
      args:
        DOCKER_GID: "${HOST_DOCKER_GID:-999}"
    image: slops:latest
    container_name: slops
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./.win-ops:/state
      - ./win:/win:ro
      - ./win:/Users/superpea/dvl/win-ops/win:ro
      - /Users/superpea/dvl/win:/Users/superpea/dvl/win:ro
      - ./win-home:/home/botuser/.win
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "bash", "/app/scripts/container-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
